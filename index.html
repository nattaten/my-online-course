<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 10 10 10</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main id="login-section" class="login-wrap">
        <section class="login-box" aria-labelledby="login-title">
            <div class="login-logo">M10</div>
            <h1 id="login-title">Math 10 10 10</h1>
            <p class="login-subtitle">เข้าสู่ระบบด้วยเบอร์โทรศัพท์ที่ลงทะเบียนไว้</p>

            <form id="login-form">
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    inputmode="tel"
                    autocomplete="tel"
                    placeholder="เบอร์โทรศัพท์ เช่น 0812345678"
                    required
                >

                <button id="login-btn" type="submit">
                    <span id="btn-text">เข้าสู่บทเรียน</span>
                    <span id="btn-loader" style="display:none;">กำลังตรวจสอบ...</span>
                </button>
            </form>

            <p id="error-msg" class="error" role="status"></p>
        </section>
    </main>
</body>
</html>
