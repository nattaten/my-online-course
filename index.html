<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 10 10 10</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="login-section" class="login-wrap">
        <div class="login-box">
            <div class="login-logo">📐</div>
            <h1>Math 10 10 10</h1>
            <p class="login-subtitle">เข้าสู่ระบบเพื่อเริ่มเรียน</p>
            <input type="email" id="email" placeholder="อีเมลของคุณ" autocomplete="email">
            <input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password">
            <button id="login-btn">
                <span id="btn-text">เข้าสู่บทเรียน</span>
                <span id="btn-loader" style="display:none;">⏳ กำลังตรวจสอบ...</span>
            </button>
            <p id="error-msg" class="error"></p>
        </div>
    </div>

    <!-- ===== VIDEO SECTION ===== -->
    <div id="video-section" style="display:none;" class="course-wrap">

        <!-- Top bar -->
        <div class="topbar">
            <div class="topbar-left">
                <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="ซ่อน/แสดง playlist">☰</button>
                <span class="topbar-title" id="course-title">ยินดีต้อนรับ</span>
            </div>
            <div class="topbar-right">
                <span id="keyboard-hint" class="keyboard-hint">← → เปลี่ยนบทเรียน</span>
                <button id="logout-btn" class="logout-btn">🚪 ออกจากระบบ</button>
            </div>
        </div>

        <!-- Course tabs (shown if multiple courses) -->
        <div id="course-tabs" class="course-tabs" style="display:none;"></div>

        <!-- Split layout -->
        <div class="split-layout" id="split-layout">

            <!-- Left: player + nav + PDF -->
            <div class="player-area">
                <div id="main-display"></div>

                <!-- Prev / Next -->
                <div class="lesson-nav">
                    <button id="prev-btn" class="nav-btn" onclick="goPrev()">← ก่อนหน้า</button>
                    <span id="nav-counter" class="nav-counter"></span>
                    <button id="next-btn" class="nav-btn nav-btn-next" onclick="goNext()">ถัดไป →</button>
                </div>

                <div id="pdf-container"></div>
            </div>

            <!-- Right: playlist -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-search-wrap">
                    <input type="text" id="playlist-search" placeholder="🔍 ค้นหาบทเรียน..." oninput="filterPlaylist()">
                </div>
                <div id="playlist" class="playlist-inner"></div>
                <div class="sidebar-footer" id="lesson-counter"></div>
            </div>

        </div>
    </div>

    <!-- Mobile backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeMobileSidebar()"></div>

    <!-- Floating playlist button (mobile) -->
    <button id="fab-playlist" class="fab-btn" onclick="toggleMobileSidebar()">📋 บทเรียน</button>

    <script src="script.js"></script>
</body>
</html>
